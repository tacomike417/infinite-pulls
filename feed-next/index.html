<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Feed — Infinite Pulls</title>
<meta name="theme-color" content="#04070f">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="../assets/icons/icon-192.png">
<!-- EVERY RELATIVE URL ON THIS PAGE RESOLVES AGAINST /feed-next/, WHATEVER
     THE ADDRESS BAR SAYS.

     A shared post rewrites the address to /<user>/post/<id> so the thing
     worth copying is in the bar. Relative URLs resolve against the
     DOCUMENT's address, not the file they were written in -- so the moment
     that rewrite happened, "../?page=lookup&scan=1" stopped meaning
     /?page=lookup&scan=1 and started meaning /tacomike417/?page=lookup, and
     the same went for every image, every script and every other nav link on
     the page. The + landing on the lookup screen with no camera was one
     symptom; broken card art would have been the next.

     One line, rather than making forty paths absolute and hoping somebody
     remembers the forty-first. -->
<base href="/feed-next/">
<link rel="stylesheet" href="./feed.css">
</head>
<body>

<!-- THE TEST FOLDER. This page reads the live shop and writes nothing, so
     nothing in here can affect infinitepulls.com. When it is right, the
     whole folder moves to the home page. -->

<!-- EVERYTHING THAT STAYS AT THE TOP, IN ONE PIECE.
     The bar, the search panel and the filter chip used to be three separate
     sticky elements all pinned to top:0 -- which means they stack on top of
     each other, and the two with the lower z-index slide underneath the bar
     and out of sight the moment you scroll. Opening search halfway down the
     feed left you typing into something you could not see. One sticky
     wrapper holds all three, so they travel together and none of them needs
     to know how tall the others are. -->
<div class="stickytop">
<header class="topbar">
  <!-- onerror must disarm itself first. Without `this.onerror=null` a
       fallback that is ALSO missing re-fires the handler, which re-sets the
       same src, forever -- a silent request loop against your own server. -->
  <!-- THE BUILD STAMP RIDES ON THE LOGO.
       It used to sit at the end of the blue rule under the wordmark, which
       was the only gap on that row -- and that gap is about five pixels on a
       360px phone. Small enough to fit there is too small to read, and this
       exists to be read. The logo tile always has a corner. -->
  <span class="markwrap">
    <img class="mark" src="../assets/logo-sm.webp" alt="Infinite Pulls"
         onerror="this.onerror=null;this.src='../assets/icons/icon-192.png'">
    <small class="ver" id="build"></small>
  </span>
  <!-- The build stamp. It is written by feed.js, on purpose: the number you
       are looking at IS the feed.js the browser is running. If it is old,
       you are on a cached copy and the refresh did not take. -->
  <h1>Infinite Pulls</h1>
  <div class="tools">
    <button class="iconbtn" type="button" aria-label="Search" data-search-open aria-expanded="false">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    </button>
    <!-- The pip that used to live here was always lit, promising unread
         things that do not exist -- there is no inbox behind this bell. It
         is the same on/off switch for notifications the rest of the app has,
         and it now looks like whichever state it is actually in. -->
    <button class="iconbtn bell" type="button" id="bell" data-bell
            aria-label="Notifications" aria-pressed="false">
      <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 1 0-12 0c0 7-2 8-2 8h16s-2-1-2-8"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      <svg viewBox="0 0 24 24" class="slash"><path d="M4 4l16 16"/></svg>
    </button>
  </div>
  <!-- Whatever the bell just did, or could not do, said out loud. A toggle
       that silently fails is worse than no toggle. -->
  <p class="bell-said" id="bellsaid" hidden></p>
</header>

<!-- SEARCH. Sits under the top bar rather than taking over the screen: the
     feed stays visible behind it, so it never feels like you left. CANCEL and
     the Escape key are both ways out, and the X on the chip is the way out of
     a filter. -->
<div class="searchwrap" id="searchwrap" hidden>
  <div class="searchbar">
    <svg viewBox="0 0 24 24" class="mag"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="search" autocomplete="off" autocorrect="off" spellcheck="false"
           placeholder="People, cards, stories" aria-label="Search the feed">
    <button class="cancel" type="button" data-search-close>CANCEL</button>
  </div>
  <div class="results" id="results" role="listbox" aria-label="Search results"></div>
</div>

<!-- What the feed is narrowed to, and the way back out of it. -->
<!-- EVERYONE / FOLLOWING (25 Sep 2026, SOCIAL-NEXT part 6). Signed in and on
     the main feed only; feed.js shows it and keeps the pressed one lit. -->
<div class="feedtabs" id="feedtabs" role="group" aria-label="Whose cards" hidden>
  <button type="button" data-feed-mode="everyone" aria-pressed="true">EVERYONE</button>
  <button type="button" data-feed-mode="following" aria-pressed="false">FOLLOWING</button>
</div>
<div class="chipbar" id="chipbar" hidden></div>
</div><!-- /stickytop -->

<main class="feed" id="feed"></main>

<!-- THE MENU SHEET.
     Two ways out before the back button: the X, and tapping the dimmed feed
     behind it. Escape closes it too. Signing in and creating an account hand
     off to the one account screen the app already has rather than this page
     growing a second sign-in form of its own -- two of those is two things
     to keep in step. Signing out is one call and happens right here. -->
<div class="sheet-wrap" id="menuwrap" hidden>
  <div class="sheet-dim" data-menu-close></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-label="Menu">
    <div class="sheet-top">
      <b id="menuwho">Menu</b>
      <button class="sheet-x" type="button" data-menu-close aria-label="Close">&times;</button>
    </div>
    <div class="sheet-rows" id="menurows"></div>
    <!-- THE STRIP THE BOTTOM BAR LIVES UNDER.
         The sheet covers the nav, so whatever row landed last sat exactly
         where MENU and COLLECTION are -- and in the menu that row was SIGN
         OUT. Tapping MENU to open and tapping it again to close, which is
         what a toggle invites, signed you out. Two people did it.
         This reserves the bar's height so no row is ever over a nav button,
         and closes the sheet when tapped, so MENU does toggle after all. -->
    <div class="sheet-foot" data-menu-close aria-hidden="true"></div>
  </div>
</div>

<!-- Five, exactly as drawn. SCAN A CARD is the raised gold ring in the
     middle. Every one of these is a real way out of this page. -->
<nav class="nav">
  <a class="on" href="./">
    <svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6.5 10v10h11V10"/></svg>
    <span>FEED</span>
  </a>
  <!-- Opens the same sheet MENU and COLLECTION do: the shelf, hours,
       location and how to reach the shop. Still a real link to the shelf
       underneath, so it goes somewhere sensible if the script has not
       loaded. -->
  <a href="../?page=shop" data-shop aria-haspopup="dialog" aria-expanded="false">
    <svg viewBox="0 0 24 24"><path d="M2.5 3.5h2.3l2.6 11.3h9.9"/><path d="M6.3 6.6h14.2l-1.8 6.6H7.8"/><circle cx="9.5" cy="19.3" r="1.5"/><circle cx="17.5" cy="19.3" r="1.5"/></svg>
    <span>SHOP</span>
  </a>
  <!-- Straight into the camera. See the ?scan=1 note in card-lookup.js for
       why the page cannot simply open it on arrival for everybody. -->
  <a class="scan" href="../?page=lookup&amp;scan=1">
    <i><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></i>
    <span>SCAN A CARD</span>
  </a>
  <!-- Opens the same kind of sheet MENU does. Still a real link to the
       collection page underneath, so it goes somewhere sensible if the
       script has not loaded. -->
  <a href="../?page=collection" data-mine aria-haspopup="dialog" aria-expanded="false">
    <svg viewBox="0 0 24 24"><rect x="4" y="3" width="11" height="15" rx="2"/><path d="M8 21h9a2 2 0 0 0 2-2V8"/></svg>
    <!-- REWARD CARDS YOU HAVE NOT LOOKED AT YET. This is where the card
         flies to when one lands, so the count has to be on the thing it
         flew into. Cleared the moment the rewards sheet is opened. -->
    <span class="navdot navdot--mine" id="minedot" hidden aria-hidden="true"></span>
    <span>COLLECTION</span>
  </a>
  <!-- MENU is where people look for account things, so that is where they
       are. It used to bounce to the home page, which was the nav's one item
       that did nothing you could not do by scrolling. -->
  <!-- MENU is where people look for account things, so that is where they
       are. It stays a link to the home page on purpose: the handler opens
       the sheet instead, but if the script has not loaded or has failed,
       tapping it still goes somewhere real rather than doing nothing. -->
  <a href="../" data-menu aria-haspopup="dialog" aria-expanded="false">
    <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    <!-- Your face goes here once you are signed in, and the lines above hide.
         A hamburger means guest; a face means you. Filled in by feed.js, so
         a signed-out visitor never downloads anything for it. -->
    <span class="me" id="navme" hidden></span>
    <!-- THE COUNT, on the corner of your own face. Outside .me on purpose:
         that circle is overflow:hidden so the photo stays round, and a badge
         inside it would be clipped in half. Hidden until there is something
         to say -- a zero is not news. -->
    <span class="navdot" id="navdot" hidden aria-hidden="true"></span>
    <span>MENU</span>
  </a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config.js"></script>
<!-- The flight recorder, before anything can call the auth server. The feed
     is a second page with its own client, and a sign-out here has to be as
     readable as one on the app. ?authlog=1 shows it. -->
<script src="../components/auth-log.js"></script>
<!-- shrink / upload / address-for-a-key. Loaded before feed.js so the add
     tile works on the first tap rather than the second. -->
<script src="../components/card-photo.js"></script>
<script src="./feed.js"></script>
<!-- AFTER feed.js, which registers the listener that draws the reveal
     panel. This is the only script that can tell whether the app was
     installed; it tells reward_assert_installed() and fires
     ip:reward-awarded so the card gets its moment here rather than
     appearing quietly in the sheet. -->
<script src="../components/app-installed.js"></script>
</body>
</html>
