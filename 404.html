<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Infinite Pulls</title>
<script>
(function(){
  var path = location.pathname;

  /* SECTIONS THAT ARE REAL FOLDERS, NOT PEOPLE.
     infinitepulls.com/infinite-questions/ is 364 static pages on disk.
     Dropping the trailing slash misses the folder's index.html, lands
     here, and — before this — got handed to the app, which read
     "infinite-questions" as somebody's username and said no such
     collector. Add the slash and the real page loads. */
  var SECTIONS = ['infinite-questions', 'pulls'];
  var first = path.replace(/^\/+/, '').split('/')[0].toLowerCase();

  if (SECTIONS.indexOf(first) !== -1) {
    if (path.charAt(path.length - 1) !== '/') {
      location.replace(path + '/' + location.search + location.hash);
      return;
    }
    /* Already slashed and still not found, so the page itself is missing.
       Send them to the front of that section rather than to a profile
       error about a section — but never to the path we are already on,
       which would loop. */
    var root = '/' + first + '/';
    if (path !== root) { location.replace(root); return; }
  }

  /* A POST WHOSE PAGE HAS NOT BEEN BUILT YET.
     tools/build-post-pages.mjs writes a real file at /<user>/post/<id>, but
     it runs on a schedule -- so for the first few minutes of a post's life
     its own address does not exist yet. Rather than send somebody to a
     profile error about a post, hand them straight to the feed with the
     post asked for. A crawler arriving in that window still gets a 404 and
     will come back; a person gets the thing they clicked. */
  var seg = path.replace(/^\/+|\/+$/g, '').split('/');
  if (seg.length === 3 && seg[1].toLowerCase() === 'post' && /^[pc]-[A-Za-z0-9-]{6,80}$/.test(seg[2])) {
    location.replace('/feed-next/?post=' + encodeURIComponent(seg[2]));
    return;
  }

  /* Everything else is a public collector page (infinitepulls.com/username)
     rendered client-side, so stash where they were going and let the app
     put it back — see the DOMContentLoaded handler in app.js. */
  try {
    sessionStorage.setItem('ip-redirect-path', path + location.search + location.hash);
  } catch (e) { /* private window: the app just opens on Home */ }
  location.replace('/');
})();
</script>
</head>
<body>
  <p>Redirecting…</p>
</body>
</html>
