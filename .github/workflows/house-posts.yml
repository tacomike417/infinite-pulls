name: House account posts

# The house accounts' clock. Wakes every 15 minutes; each account's own
# script decides whether one of today's random slots has come due, so
# most runs just say "nothing due" and stop in a few seconds.
#
# Run it by hand from the Actions tab (Run workflow) to test:
#   dry   -- build a picture and attach it to the run, post nothing
#   force -- post one right now, ignoring the schedule

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry = picture only, force = post one now, normal = follow the schedule'
        required: true
        default: 'dry'
        type: choice
        options: [dry, force, normal]
      account:
        description: 'Which account to run (the timer always runs all of them)'
        required: true
        default: 'all'
        type: choice
        options: [all, tcgcardwatch, oddballemon, professorpulls, danspokemonfinds]

concurrency:
  group: house-posts
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tcgcardwatch:
    if: ${{ github.event_name == 'schedule' || github.event.inputs.account == 'all' || github.event.inputs.account == 'tcgcardwatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pillow
      - name: TCGCardWatch
        env:
          HOUSE_MODE: ${{ github.event.inputs.mode || 'normal' }}
          TCGCARDWATCH_PASSWORD: ${{ secrets.TCGCARDWATCH_PASSWORD }}
        run: python tools/house/tcgcardwatch.py
      - name: Attach the dry-run picture
        if: ${{ github.event.inputs.mode == 'dry' }}
        uses: actions/upload-artifact@v4
        with:
          name: tcgcardwatch-preview
          path: house-preview.jpg
          if-no-files-found: ignore

  oddballemon:
    if: ${{ github.event_name == 'schedule' || github.event.inputs.account == 'all' || github.event.inputs.account == 'oddballemon' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pillow
      - name: oddballemon
        env:
          HOUSE_MODE: ${{ github.event.inputs.mode || 'normal' }}
          # Every house account shares one password. HOUSE_PASSWORD if it
          # is ever set on its own; the one already saved for TCGCardWatch
          # otherwise, so no new secret is needed per account.
          HOUSE_PASSWORD: ${{ secrets.HOUSE_PASSWORD || secrets.TCGCARDWATCH_PASSWORD }}
        run: python tools/house/oddballemon.py

  professorpulls:
    if: ${{ github.event_name == 'schedule' || github.event.inputs.account == 'all' || github.event.inputs.account == 'professorpulls' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pillow
      - name: Professor Pulls
        env:
          HOUSE_MODE: ${{ github.event.inputs.mode || 'normal' }}
          HOUSE_PASSWORD: ${{ secrets.HOUSE_PASSWORD || secrets.TCGCARDWATCH_PASSWORD }}
        run: python tools/house/professorpulls.py

  danspokemonfinds:
    if: ${{ github.event_name == 'schedule' || github.event.inputs.account == 'all' || github.event.inputs.account == 'danspokemonfinds' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pillow
      - name: danspokemonfinds
        env:
          HOUSE_MODE: ${{ github.event.inputs.mode || 'normal' }}
          HOUSE_PASSWORD: ${{ secrets.HOUSE_PASSWORD || secrets.TCGCARDWATCH_PASSWORD }}
          DANS_EMAIL: ${{ vars.DANS_EMAIL || 'cantoncollector@infinitepulls.com' }}
        run: python tools/house/danspokemonfinds.py
