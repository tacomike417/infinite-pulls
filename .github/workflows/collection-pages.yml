name: Build collection pages

on:
  schedule:
    - cron: '15,45 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'tools/build-collection-pages.mjs'
      - '.github/workflows/collection-pages.yml'

concurrency:
  group: collection-pages
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build the pages and the sitemap
        run: node tools/build-collection-pages.mjs
      - name: Commit whatever changed
        run: |
          git config user.name  "infinite-pulls-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Nothing to publish."
            exit 0
          fi
          git commit -m "Collection pages: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push || (git pull --rebase && git push)
