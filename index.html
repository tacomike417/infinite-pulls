<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#03070d">
  <meta name="description" content="Infinite Pulls TCG & Hobby Shop">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png">
  <link rel="stylesheet" href="./style.css">
  <title>Infinite Pulls</title>
</head>
<body>
  <div id="app-shell">
    <div id="site-banner" class="site-banner" hidden>
      <span id="site-banner-text"></span>
      <button type="button" id="site-banner-close" aria-label="Close">✕</button>
    </div>

    <header id="topbar"></header>


    <!-- Where you are. Hidden on Home, where it would say nothing. -->
    <nav id="breadcrumb" class="breadcrumb" aria-label="Breadcrumb" hidden></nav>

    <!-- Asked once, after sign-in, and never again. See the note at the
         top of components/notify-invite.js for why it cannot simply be on. -->
    <div id="notify-invite" class="notify-invite" hidden></div>

    <main id="page-content" tabindex="-1">
      <noscript>This app requires JavaScript.</noscript>
    </main>

    <nav id="navbar" aria-label="Primary"></nav>

    <!-- REAL LINKS, IN THE HTML, BEFORE ANY SCRIPT RUNS.
         Everything else on this page is drawn by JavaScript, so the menu row
         and the home chip that point at Infinite Questions do not exist until
         the app has booted. A crawler taking its first look sees an empty
         shell and no way into 364 pages. These three anchors are the way in,
         and they cost one line of markup. -->
    <footer class="shell-foot">
      <a href="/infinite-questions/">Infinite Questions</a>
      <a href="/?page=gallery">The Gallery</a>
      <a href="/?page=movers">Movers &amp; Shakers</a>
    </footer>
  </div>

  <!-- MY CARDS — half a sheet, above the bar.
       Everything that belongs to the visitor, behind one button, so the
       bar can hold Shop again without going to six labels across a phone. -->
  <div id="mine-sheet" class="mine-sheet" hidden>
    <button class="mine-backdrop" data-close-mine aria-label="Close"></button>
    <section class="mine-panel" aria-label="My Cards">
      <div class="mine-grabber" aria-hidden="true"></div>
      <div class="mine-panel-header">
        <strong>My Cards</strong>
        <button class="icon-button" data-close-mine aria-label="Close">&#10005;</button>
      </div>
      <div id="mine-links" class="mine-links"></div>
    </section>
  </div>

  <div id="menu-sheet" class="menu-sheet" hidden>
    <button class="menu-backdrop" data-close-menu aria-label="Close menu"></button>
    <section class="menu-panel" aria-label="Menu">
      <div class="menu-panel-header">
        <strong>Menu</strong>
        <button class="icon-button" data-close-menu aria-label="Close menu">✕</button>
      </div>
      <div id="menu-links" class="menu-links"></div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <script src="./components/topbar.js"></script>
  <!-- Before the navbar, because the navbar has to know whether to draw
       the ∞ tab. It answers from a cached value synchronously. -->
  <script src="./components/infinite-dex-switch.js"></script>
  <script src="./components/navbar.js"></script>
  <!-- After navbar.js: it reads the nav's own labels rather than keeping a
       second list that would drift out of step. -->
  <script src="./components/breadcrumb.js"></script>
  <script src="./components/notify-invite.js"></script>
  <script src="./app.js"></script>
  <script src="./components/account.js"></script>
  <script src="./components/pokemon-data.js"></script>
  <script src="./components/pokemon-info.js"></script>
  <script src="./components/collector-goals-data.js"></script>
  <script src="./components/tcgdex-cache.js"></script>
  <script src="./components/sealed.js"></script>
  <script src="./components/collection-import-parse.js"></script>
  <script src="./components/collection-import-resolve.js"></script>
  <script src="./components/collection-import.js"></script>
  <script src="./components/collection.js"></script>
  <script src="./components/pokedex.js"></script>
  <script src="./components/infinite-dex-data.js"></script>
  <script src="./components/infinite-dex.js"></script>
  <script src="./components/hello-bar.js"></script>
  <script src="./components/gallery-image.js"></script>
  <script src="./components/gallery.js"></script>
  <script src="./components/collector-goals.js"></script>
  <!-- Before anything that draws a value: the green/red arrows and the one
       place that decides whether drawing one is honest. -->
  <script src="./components/price-trend.js"></script>
  <!-- After pokemon-data.js: the scoreboard counts Pokemon with it. -->
  <script src="./components/home-stats.js"></script>
  <script src="./components/home-rails.js"></script>
  <!-- After collector-goals-data.js and infinite-dex-data.js: it reads both. -->
  <script src="./components/home-mine.js"></script>
  <!-- Before card-lookup.js, which uses it for sealed product. -->
  <script src="./components/barcode-scan.js"></script>
  <!-- After collection.js and sealed.js: the lookup page is a front door onto both. -->
  <script src="./components/card-lookup.js"></script>
  <!-- After price-trend.js, whose colours it shares. Needs nothing else:
       the movers board is public and reads one function. -->
  <script src="./components/movers.js"></script>
  <script src="./components/shop.js"></script>
  <script src="./components/profile.js"></script>
</body>
</html>
