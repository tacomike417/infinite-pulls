<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
<script>
/* ======================================================================
   THE FRONT DOOR IS THE FEED NOW.
   ----------------------------------------------------------------------
   This file is still the old app, and the old app is still where a dozen
   real screens live -- your collection, your goals, your account, the
   shelf, the opening hours. Those are not going anywhere; the feed links
   straight at them. What has gone is the old app's own HOME PAGE, its nav
   bar, and the pages nothing in the new design points at.

   So: an address with no ?page= on it is somebody arriving at the site,
   and they get the feed. An address with a ?page= we still use loads the
   old app exactly as before. An address with a ?page= we have retired --
   gallery, the old menu, the old home -- goes to the feed too, because
   leaving a live door into a design we have replaced is how somebody ends
   up wandering back out of the new site and never finding their way in
   again.

   WHY THIS RUNS BEFORE ANYTHING ELSE. It is the first thing in <head>,
   above the stylesheet and every script, so a retired page never paints.
   A redirect that fires after the old home page has drawn is a flash of
   the thing we are replacing.

   THE ONE THING THAT MUST NOT BE CAUGHT BY THIS: 404.html sends every
   public collector page -- infinitepulls.com/tacomike417 -- through here
   with the real path stashed in sessionStorage, and app.js puts it back
   once it boots. Those arrive with NO ?page= at all, which is exactly the
   shape of "somebody arriving at the site". Redirecting them to the feed
   would have broken every profile link on the site, including the ones
   inside the generated post pages. So the stash is checked first.
   ====================================================================== */
(function () {
  try {
    /* A profile page on its way through. Leave it alone. */
    if (sessionStorage.getItem('ip-redirect-path')) return;
  } catch (e) { /* private window: fall through, the worst case is the feed */ }

  var page = new URLSearchParams(location.search).get('page');

  /* THE PAGES THE NEW DESIGN STILL REACHES. Every one of these is linked
     from the feed, its menu, or the shop sheet. If a row is ever removed
     from the feed, its page belongs on this list only as long as something
     still points at it -- a page nobody can reach is not a page. */
  var LIVE = ['account','collection','wishlist','goals','pokedex','dex',
              'lookup','shop','item','thanks','hours','location','contact',
              'movers','about'];

  if (page && LIVE.indexOf(page) !== -1) return;   /* carry on into the app */

  /* AN AUTH PAYLOAD MUST SURVIVE THIS REDIRECT.

     A Supabase confirmation link lands here as
     infinitepulls.com/#access_token=...&refresh_token=...  and
     location.replace('/feed-next/') THROWS THE FRAGMENT AWAY, because the
     hash is not part of the path being replaced. supabase-js on the feed
     then finds nothing in the URL and the person who just confirmed their
     email arrives as a guest -- which is exactly what happened: land on the
     feed, hamburger says "browsing as a guest", tap the plus, get asked to
     sign in to the account you made ninety seconds ago.

     So the auth bits are carried across. Only the auth bits: a general
     `+ location.search` would drag a retired ?page= into the feed, which is
     the thing this redirect exists to stop. Covers the implicit flow
     (#access_token), the PKCE flow (?code=), and Supabase's error returns,
     so an expired link still reaches a page that can say so. */
  var auth = '';
  if (/[#&](access_token|refresh_token|error|error_description)=/.test(location.hash)) {
    auth = location.hash;
  } else if (/[?&](code|error|error_description)=/.test(location.search)) {
    auth = location.search;
  }

  /* replace() rather than href so Back does not bounce them straight back
     into the door they just came out of. */
  location.replace('/feed-next/' + auth);
})();
</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#03070d">
  <meta name="description" content="Infinite Pulls TCG & Hobby Shop">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png">
  <link rel="stylesheet" href="./style.css">
  <title>Infinite Pulls</title>
</head>
<body>
  <div id="app-shell">
    <div id="site-banner" class="site-banner" hidden>
      <span id="site-banner-text"></span>
      <button type="button" id="site-banner-close" aria-label="Close">✕</button>
    </div>

    <header id="topbar"></header>


    <!-- Where you are. Hidden on Home, where it would say nothing. -->
    <nav id="breadcrumb" class="breadcrumb" aria-label="Breadcrumb" hidden></nav>

    <!-- Asked once, after sign-in, and never again. See the note at the
         top of components/notify-invite.js for why it cannot simply be on. -->
    <div id="notify-invite" class="notify-invite" hidden></div>

    <main id="page-content" tabindex="-1">
      <noscript>This app requires JavaScript.</noscript>
    </main>

    <nav id="navbar" aria-label="Primary"></nav>

    <!-- REAL LINKS, IN THE HTML, BEFORE ANY SCRIPT RUNS.
         Everything else on this page is drawn by JavaScript, so the menu row
         and the home chip that point at Infinite Questions do not exist until
         the app has booted. A crawler taking its first look sees an empty
         shell and no way into 364 pages. These three anchors are the way in,
         and they cost one line of markup. -->
    <footer class="shell-foot">
      <a href="/infinite-questions/">Infinite Questions</a>
      <a href="/?page=gallery">The Gallery</a>
      <a href="/?page=movers">Movers &amp; Shakers</a>
    </footer>
  </div>

  <!-- MY CARDS — half a sheet, above the bar.
       Everything that belongs to the visitor, behind one button, so the
       bar can hold Shop again without going to six labels across a phone. -->
  <div id="mine-sheet" class="mine-sheet" hidden>
    <button class="mine-backdrop" data-close-mine aria-label="Close"></button>
    <section class="mine-panel" aria-label="My Cards">
      <div class="mine-grabber" aria-hidden="true"></div>
      <div class="mine-panel-header">
        <strong>My Cards</strong>
        <button class="icon-button" data-close-mine aria-label="Close">&#10005;</button>
      </div>
      <div id="mine-links" class="mine-links"></div>
    </section>
  </div>

  <div id="menu-sheet" class="menu-sheet" hidden>
    <button class="menu-backdrop" data-close-menu aria-label="Close menu"></button>
    <section class="menu-panel" aria-label="Menu">
      <div class="menu-panel-header">
        <strong>Menu</strong>
        <button class="icon-button" data-close-menu aria-label="Close menu">✕</button>
      </div>
      <div id="menu-links" class="menu-links"></div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <!-- FIRST, and before anything can call the auth server. It wraps fetch to
       catch a refusal nothing in the app would otherwise ever see, so it has
       to be in place before the first request goes out. Read it with
       ?authlog=1 on any page. -->
  <script src="./components/auth-log.js"></script>
  <script src="./components/topbar.js"></script>
  <!-- Before the navbar, because the navbar has to know whether to draw
       the ∞ tab. It answers from a cached value synchronously. -->
  <script src="./components/infinite-dex-switch.js"></script>
  <script src="./components/navbar.js"></script>
  <!-- After navbar.js: it reads the nav's own labels rather than keeping a
       second list that would drift out of step. -->
  <script src="./components/breadcrumb.js"></script>
  <script src="./components/notify-invite.js"></script>
  <script src="./app.js"></script>
  <script src="./components/account.js"></script>
  <script src="./components/pokemon-data.js"></script>
  <script src="./components/pokemon-info.js"></script>
  <script src="./components/collector-goals-data.js"></script>
  <script src="./components/tcgdex-cache.js"></script>
  <script src="./components/sealed.js"></script>
  <script src="./components/collection-import-parse.js"></script>
  <script src="./components/collection-import-resolve.js"></script>
  <script src="./components/collection-import.js"></script>
  <!-- Before collection.js: the add path hands it the frame the scanner
       took. Does nothing at all until CARD_PHOTO_BASE is set in config.js. -->
  <script src="./components/card-photo.js"></script>
  <script src="./components/collection.js"></script>
  <script src="./components/pokedex.js"></script>
  <script src="./components/infinite-dex-data.js"></script>
  <script src="./components/infinite-dex.js"></script>
  <script src="./components/hello-bar.js"></script>
  <script src="./components/gallery-image.js"></script>
  <script src="./components/gallery.js"></script>
  <script src="./components/collector-goals.js"></script>
  <!-- Before anything that draws a value: the green/red arrows and the one
       place that decides whether drawing one is honest. -->
  <script src="./components/price-trend.js"></script>
  <!-- After pokemon-data.js: the scoreboard counts Pokemon with it. -->
  <script src="./components/home-stats.js"></script>
  <script src="./components/home-rails.js"></script>
  <!-- After collector-goals-data.js and infinite-dex-data.js: it reads both. -->
  <script src="./components/home-mine.js"></script>
  <!-- Before card-lookup.js, which uses it for sealed product. -->
  <script src="./components/barcode-scan.js"></script>
  <!-- After collection.js and sealed.js: the lookup page is a front door onto both. -->
  <script src="./components/card-lookup.js"></script>
  <!-- After price-trend.js, whose colours it shares. Needs nothing else:
       the movers board is public and reads one function. -->
  <script src="./components/movers.js"></script>
  <script src="./components/shop.js"></script>
  <script src="./components/profile.js"></script>
  <!-- LAST, on purpose. It is the only thing that can tell whether this is
       the installed app, and it reports it to reward_assert_installed(). It
       waits for whichever script built the shared Supabase client, so being
       last costs nothing and guarantees the client exists. Loaded on the
       shell, the feed and admin -- everywhere somebody can land when they
       open the installed app. NOT on post/, which is its own PWA. -->
  <script src="./components/app-installed.js"></script>
</body>
</html>
