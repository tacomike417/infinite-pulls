<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#03070d">
  <meta name="description" content="Infinite Pulls TCG & Hobby Shop">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png">
  <link rel="stylesheet" href="./style.css">
  <title>Infinite Pulls</title>
</head>
<body>
  <div id="app-shell">
    <div id="site-banner" class="site-banner" hidden>
      <span id="site-banner-text"></span>
      <button type="button" id="site-banner-close" aria-label="Close">✕</button>
    </div>

    <header id="topbar"></header>

    <!-- Stays on screen the whole time somebody is signed in, because the
         username on it is what Jeff asks for at the counter. -->
    <div id="hello-bar" class="hello-bar" hidden></div>

    <main id="page-content" tabindex="-1">
      <noscript>This app requires JavaScript.</noscript>
    </main>

    <nav id="navbar" aria-label="Primary"></nav>
  </div>

  <div id="menu-sheet" class="menu-sheet" hidden>
    <button class="menu-backdrop" data-close-menu aria-label="Close menu"></button>
    <section class="menu-panel" aria-label="Menu">
      <div class="menu-panel-header">
        <strong>Menu</strong>
        <button class="icon-button" data-close-menu aria-label="Close menu">✕</button>
      </div>
      <div id="menu-links" class="menu-links"></div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <script src="./components/topbar.js"></script>
  <!-- Before the navbar, because the navbar has to know whether to draw
       the ∞ tab. It answers from a cached value synchronously. -->
  <script src="./components/infinite-dex-switch.js"></script>
  <script src="./components/navbar.js"></script>
  <script src="./app.js"></script>
  <script src="./components/account.js"></script>
  <script src="./components/pokemon-data.js"></script>
  <script src="./components/pokemon-info.js"></script>
  <script src="./components/collector-goals-data.js"></script>
  <script src="./components/tcgdex-cache.js"></script>
  <script src="./components/sealed.js"></script>
  <script src="./components/collection-import-parse.js"></script>
  <script src="./components/collection-import-resolve.js"></script>
  <script src="./components/collection-import.js"></script>
  <script src="./components/collection.js"></script>
  <script src="./components/pokedex.js"></script>
  <script src="./components/infinite-dex-data.js"></script>
  <script src="./components/infinite-dex.js"></script>
  <script src="./components/hello-bar.js"></script>
  <script src="./components/gallery-image.js"></script>
  <script src="./components/gallery.js"></script>
  <script src="./components/collector-goals.js"></script>
  <!-- After pokemon-data.js: the scoreboard counts Pokemon with it. -->
  <script src="./components/home-stats.js"></script>
  <script src="./components/home-rails.js"></script>
  <!-- After collector-goals-data.js and infinite-dex-data.js: it reads both. -->
  <script src="./components/home-mine.js"></script>
  <script src="./components/profile.js"></script>
</body>
</html>
